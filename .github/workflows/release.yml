name: Test, build, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: npm run updates
      - name: Verify generated update hash
        run: |
          expected="$(cut -d' ' -f1 dist/codex-zotero-obsidian-bridge.xpi.sha256)"
          actual="$(sha256sum codex-zotero-obsidian-bridge.xpi | cut -d' ' -f1)"
          test "$expected" = "$actual"
          node -e 'const u=require("./dist/updates.json");const x=Object.values(u.addons)[0].updates[0];if(x.update_hash!==`sha256:${process.argv[1]}`)process.exit(1)' "$actual"
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-xpi
          path: |
            codex-zotero-obsidian-bridge.xpi
            dist/codex-zotero-obsidian-bridge.xpi.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            codex-zotero-obsidian-bridge.xpi
            dist/codex-zotero-obsidian-bridge.xpi.sha256
            dist/updates.json
          generate_release_notes: true
